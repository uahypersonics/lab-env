name: Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test wheel
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-test"
          "${RUNNER_TEMP}/wheel-test/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-test/bin/lab" --version
          "${RUNNER_TEMP}/wheel-test/bin/lab" --config "${RUNNER_TEMP}/config.toml" init
          "${RUNNER_TEMP}/wheel-test/bin/lab" --config "${RUNNER_TEMP}/config.toml" hosts

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/